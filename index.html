<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Happy Anniversary Nae Sesang</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Noto+Serif+Tamil:wght@400&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--l:#3a294d;--ll:#4a355d;--d:#4d2d66;--dd:#33204a;--t:#40364A;--serif:"Cormorant Garamond","Noto Serif Tamil",Georgia,serif;--head:"Playfair Display","Noto Serif Tamil",Georgia,serif;--hand:"Great Vibes","Brush Script MT",cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--w);color:var(--t);font-family:var(--serif);font-size:1.25rem;line-height:1.7;overflow-x:hidden}
section{position:relative;overflow:hidden}
.full{min-height:100dvh;display:grid;place-items:center}
.ph{display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,var(--l),var(--ll) 55%,#d9c9ee);color:var(--t);font:600 .8rem/1.3 var(--head);letter-spacing:.08em;opacity:1;overflow:hidden;width:100%;height:100%}
.ph span{background:rgba(255,255,255,.7);padding:.3em .8em;border-radius:99px}
.bg{position:absolute;inset:0;z-index:0}
.bg>img,.bg>.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;animation:zoom 22s ease-out forwards}
@media(min-width:821px){#heroBg>img{object-position:center 35%}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(64,54,74,.28),rgba(64,54,74,.38))}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.hero-copy{position:relative;z-index:1;width:100%;padding:0 1rem;text-align:center}
.hero h1{margin:0;color:#fff;font:500 clamp(1.125rem,6.5vw,5.5rem)/1.1 "Bodoni Moda",serif;letter-spacing:.04em;white-space:nowrap;text-shadow:0 2px 24px rgba(64,54,74,.45);animation:heroTitleIn 1.8s cubic-bezier(.2,.7,.25,1) both}
.hero-subtitle{margin:.65rem 0 0;color:#fff;font:400 clamp(1.375rem,2.5vw,1.625rem)/1.3 "Cinzel",serif;letter-spacing:.16em;animation:heroSubtitleIn 1.5s cubic-bezier(.2,.7,.25,1) .45s both}
.hero-heart{display:block;margin-top:.3rem;color:#fff;font-size:1.35rem;line-height:1;animation:heroSubtitleIn 1.5s cubic-bezier(.2,.7,.25,1) .65s both}
.nae h2{position:relative;z-index:1;margin:0;padding:0 1.2rem;text-align:center;font:400 clamp(2.2rem,7vw,5.5rem)/1.15 var(--head);letter-spacing:.06em;color:#fff;text-shadow:0 2px 24px rgba(64,54,74,.45);animation:fade 3.2s ease .4s both}
.nae h2{font-family:var(--serif);font-weight:600;letter-spacing:.3em;animation:none}
.nae h2 span{display:inline-block;opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s}
.nae.in h2 span{opacity:1;transform:none}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes heroTitleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes heroSubtitleIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.chip{position:absolute;left:.8rem;bottom:.8rem;z-index:2;font:.65rem var(--head);background:rgba(255,255,255,.75);padding:.2em .7em;border-radius:99px}
/* proposal */
.proposal{background:#FFFFFF;padding:6rem 1.2rem;overflow:visible}
.proposal-hearts{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.proposal>.wrap{position:relative;z-index:1}
.wrap{max-width:660px;margin:0 auto}
.date{text-align:center;font:400 clamp(2rem,6vw,3.2rem) var(--hand);color:var(--d);margin:0 0 .5rem}
.scene{position:relative;max-width:520px;margin:0 auto 3rem;aspect-ratio:520/300}
.scene svg,.scene .ph{width:100%;height:100%;border-radius:24px}
.scene-image {
  position: absolute;
  inset: 0;
  border-radius: 24px !important;
  overflow: visible !important;
}

.scene-image > img {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 24px !important;
  clip-path: inset(0 round 24px) !important;
  -webkit-clip-path: inset(0 round 24px) !important;
  transform-origin: center;
  transition: transform .4s ease;
}
@media (hover:hover) and (pointer:fine) and (min-width:561px){.scene-image>img:hover{transform:scale(1.5);z-index:2}}
.proposal-heart{position:absolute;display:block;color:rgba(77,45,102,.82);animation:proposal-heart-float var(--duration) ease-in-out var(--delay) infinite;will-change:transform,opacity}
@keyframes proposal-heart-float{0%{opacity:0;transform:translateY(0) scale(.8)}18%{opacity:.65}72%{opacity:.5}100%{opacity:0;transform:translateY(-110px) scale(1.05)}}
.fh{position:absolute;color:var(--d);animation:flt 5s ease-in-out infinite;pointer-events:none}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.letter{background:var(--d);color:#FFFFFF;border-radius:6px;padding:clamp(1.4rem,5vw,3rem);box-shadow:0 18px 50px -22px rgba(77,45,102,.55)}
.letter p{margin:0 0 1.5em;max-width:62ch}
.letter p:last-child{margin:0;font:400 1.9rem/1.3 var(--hand);color:inherit}
.rv{opacity:0;transform:translateY(18px);transition:opacity 1s,transform 1s}
.rv.in{opacity:1;transform:none}
/* titles */
.title{text-align:center;font:400 clamp(1.8rem,4.5vw,2.8rem) var(--head);color:var(--d);margin:0 0 3rem}
/* poems */
.poems{background:#FFFFFF;padding:6rem 1.2rem}
.poems-hearts{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.poems>.title,.poems>.pg{position:relative;z-index:1}
.pg{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:1.6rem}
.pc{position:relative;grid-column:span 2;background:var(--d);border-radius:10px 10px 18px 10px;padding:1.8rem 1.6rem 1.4rem;min-height:260px;display:flex;flex-direction:column;box-shadow:0 14px 34px -16px rgba(64,54,74,.35);transition:transform .5s,box-shadow .5s;animation:flt 7s ease-in-out infinite}
.pc:nth-child(1){grid-column:1/-1;max-width:620px;margin:0 auto;width:100%;min-height:380px;padding:2.4rem 2.2rem 1.8rem;animation-delay:-2s}
.pc:nth-child(3n){animation-delay:-3s}
.pc:nth-child(5){grid-column:2/span 2}.pc:nth-child(6){grid-column:4/span 2}
.pc:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 24px 44px -16px rgba(64,54,74,.4);animation-play-state:paused}
.pc h3{margin:0 0 .8rem;font:700 1rem "Cormorant Garamond",Georgia,serif;color:#FFFFFF;letter-spacing:.1em;text-decoration:underline;text-underline-offset:.15em}
.pc .body{flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(17px,1.32vw,20px);font-weight:400;line-height:1.75;color:#FFFFFF;white-space:pre-wrap}
.pc .sig{font:400 1.6rem var(--hand);color:#FFFFFF;text-align:right;margin-top:.8rem;min-height:2.2rem;border-top:1px dotted var(--d)}
.pc .fl{position:absolute;right:.9rem;top:.7rem;color:#FFFFFF;font-size:.9rem}
/* timeline */
.tl{background:linear-gradient(var(--w),var(--ll));padding:6rem 1.2rem}
#s5{--l:#E8DDF5;--ll:#F5F0FA;--d:#A477C5;--dd:#9165B3}
#s5 .proposal-heart{color:rgba(145,101,179,.82)}
.timeline-hearts{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.tl>.title,.tl>.path,.tl>.special{position:relative;z-index:1}
.path{position:relative;max-width:1000px;margin:0 auto}
.path svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.path path{fill:none;stroke:var(--d);stroke-width:2;stroke-dasharray:2 9;stroke-linecap:round}
.m{position:relative;z-index:1;width:min(300px,78vw);aspect-ratio:1;margin:0 0 -2.5rem 6%;filter:drop-shadow(0 8px 14px rgba(64,54,74,.18));transition:transform .55s cubic-bezier(.2,.7,.2,1),filter .55s}
.m:nth-child(2),.m:nth-child(4){margin-bottom:2rem}
.m:nth-child(even){margin-left:auto;margin-right:6%}
.m:nth-child(3n){margin-left:32%}.m:nth-child(3n+2):nth-child(odd){margin-left:20%}
.m .c{width:100%;height:100%;background:#fff;border-radius:18px;clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%);padding:.8rem;display:flex;flex-direction:column;gap:.35rem;cursor:pointer}
.m:nth-child(odd) .c{background:var(--ll)}
.m .c::after{content:"";position:absolute;right:0;bottom:0;width:30px;height:30px;background:linear-gradient(135deg,var(--d) 50%,transparent 50%);border-radius:0 0 18px 0;transform:scaleX(-1) rotate(90deg);opacity:.55}
.m .im{flex:1;border-radius:10px;overflow:hidden;min-height:0}
.m .im>img{width:100%;height:100%;object-fit:contain}
.m .im>*{transition:transform .7s}
.m .dt{font:600 1.15rem/1 var(--head);text-align:center}
.m .ti{font:italic 1rem/1.2 var(--serif);text-align:center;color:#6a5a7a;min-height:1.2em}
.m.on{transform:translateY(-14px) scale(1.16);z-index:5;filter:drop-shadow(0 22px 28px rgba(64,54,74,.32))}
.m.on .im>*{transform:scale(1.1)}
.m.nb{transform:scale(.96)}
.special{max-width:640px;margin:6rem auto 0;text-align:center;padding:2.6rem 1.6rem;border-radius:20px;background:var(--l);position:relative}
.special::before{content:"♡";display:block;font-size:1.6rem;color:var(--d)}
.special p{margin:.4rem 0 0;font:400 1.25rem/1.65 "Cormorant Garamond",Georgia,serif}
.special-date{display:flex;justify-content:center;align-items:baseline;margin-top:1rem;font:400 1.15rem/1.4 "Cormorant Garamond",Georgia,serif;color:var(--t)}
.special-date input{width:2.2em;padding:0;border:0;border-bottom:1px dotted var(--d);border-radius:0;background:transparent;color:inherit;font:inherit;text-align:center}
.special-date input:focus-visible{outline:2px solid var(--d);outline-offset:2px}
.special-player{width:min(100%,520px);aspect-ratio:1898/530;margin:1rem auto 0;padding:8px 10px 6px;display:flex;flex-direction:column;justify-content:space-between;color:var(--t);opacity:0;transition:opacity .5s ease}
.special-player.is-visible{opacity:1}
.special-player[hidden]{display:none}
.player-audio{display:none}
.player-progress{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.2em;align-items:center;gap:.45rem;width:100%}
.player-time{font:400 clamp(.68rem,2.2vw,.82rem)/1 "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.player-time:last-child{text-align:right}
.player-seek{width:100%;height:24px;margin:0;appearance:none;background:transparent;cursor:pointer;touch-action:pan-y}
.player-seek::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--t) 0%,var(--t) var(--progress,0%),rgba(64,54,74,.2) var(--progress,0%),rgba(64,54,74,.2) 100%)}
.player-seek::-moz-range-track{height:6px;border-radius:99px;background:rgba(64,54,74,.2)}
.player-seek::-moz-range-progress{height:6px;border-radius:99px;background:var(--t)}
.player-seek::-webkit-slider-thumb{width:16px;height:16px;margin-top:-5px;appearance:none;border:0;border-radius:50%;background:var(--t);box-shadow:0 1px 5px rgba(64,54,74,.25);transition:transform .18s ease}
.player-seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--t);box-shadow:0 1px 5px rgba(64,54,74,.25);transition:transform .18s ease}
.player-seek:hover::-webkit-slider-thumb{transform:scale(1.15)}
.player-seek:hover::-moz-range-thumb{transform:scale(1.15)}
.player-controls{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,36px);width:100%}
.player-control{width:38px;height:40px;padding:5px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:inherit;cursor:pointer;transition:transform .18s ease,background-color .18s ease,opacity .18s ease}
.player-control:hover:not(:disabled){transform:scale(1.12);background:rgba(77,45,102,.16)}
.player-control:active:not(:disabled){transform:scale(.94)}
.player-control:disabled{opacity:.38;cursor:not-allowed}
.player-control svg{width:100%;height:100%;fill:currentColor;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.player-play{width:54px;height:54px;padding:11px;border:3px solid currentColor}
.player-play svg{width:100%;height:100%}
.player-control[aria-pressed="true"]{color:var(--dd);background:rgba(77,45,102,.16)}
.player-status{margin:.35rem 0 0;color:#8b2f3c;font:400 .9rem/1.3 "Cormorant Garamond",Georgia,serif}
.player-status[hidden]{display:none}
@media(max-width:420px){.special-player{padding:5px 5px 4px}.player-progress{grid-template-columns:2.8em minmax(0,1fr) 2.8em;gap:.25rem}.player-controls{gap:clamp(10px,4vw,18px)}.player-control{width:34px;height:36px}.player-play{width:46px;height:46px}}
/* surprise */
.sur{background:#fff url("images/final page surprise.png") center/cover no-repeat;display:grid;place-items:center;min-height:100dvh;padding:2rem 1rem;position:relative}
.sur h2{margin:0;font:400 clamp(1.7rem,6vw,4.2rem)/1.2 var(--head);text-align:center;letter-spacing:.12em;max-width:16ch;position:relative;color:var(--t)}
.sur h2 .ch{display:inline-block;opacity:0;transform:translateY(16px)}
.sur.in h2 .ch{animation:fade 1s ease forwards}
#E{display:inline-block}
.rope{position:absolute;width:44px;margin-left:-22px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:swing 4s ease-in-out infinite;touch-action:none;cursor:grab;outline-offset:4px;z-index:3}
.rope.drag,.rope.gone{animation:none}
.rope.gone{opacity:0;pointer-events:none;transition:opacity .6s}
.rope i{width:2px;background:repeating-linear-gradient(var(--d) 0 4px,var(--dd) 4px 8px);height:70px}
.rope b{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--d));box-shadow:0 3px 8px rgba(64,54,74,.3)}
.rope.sp i{transition:height .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.stage{display:none;position:absolute;inset:0;background:rgba(255,255,255,.96);z-index:4;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.4rem;text-align:center}
.stage.show{display:flex}
.mas{width:min(190px,45vw);aspect-ratio:200/190;animation:pop .8s cubic-bezier(.3,1.6,.5,1) both,bob 2.6s ease-in-out .8s infinite}
#mas img{width:100%;height:100%;object-fit:contain}
@keyframes pop{from{transform:scale(0) rotate(-12deg)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bub{position:relative;background:var(--ll);border:2px solid var(--l);border-radius:22px;padding:1rem 1.4rem;max-width:30rem;font-size:1.3rem;color:#fff}
.bub::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--l)}
.cnt{font:600 2.4rem var(--head);color:var(--d);letter-spacing:.1em;position:relative}
.msg{min-height:1.6em;font-size:1.05rem}
.btn{font:600 1rem var(--head);min-height:44px;padding:.6rem 1.5rem;border:2px solid var(--dd);border-radius:99px;background:#fff;color:var(--t);cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}
.btn:hover{background:var(--d);color:#fff}
.qr{display:none;flex-direction:column;align-items:center;gap:1rem;animation:pop 1s cubic-bezier(.3,1.4,.5,1) both}
.qr.show{display:flex}
.qb{width:min(240px,60vw);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 0 0 8px var(--l),0 20px 50px -14px rgba(77,45,102,.8)}
.qb img{width:100%;height:100%;object-fit:cover}
.hp{position:fixed;z-index:9;pointer-events:none;color:var(--d);animation:up 1.6s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-130px) scale(1.4)}}
/* nav */
nav{position:fixed;right:.9rem;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:.9rem}
nav a{width:10px;height:10px;border-radius:50%;background:rgba(77,45,102,.4);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--dd);transition:.4s}
nav a.on{background:var(--dd);transform:scale(1.4)}
:focus-visible{outline:3px solid var(--dd);outline-offset:3px}
.pin-gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:1.5rem;background:#fff;opacity:1;transition:opacity .8s ease}
.pin-gate[hidden]{display:none}
.pin-gate.is-unlocking{opacity:0;pointer-events:none}
.pin-card{width:min(100%,360px);color:#512A75;text-align:center}
.pin-card h1{margin:0 0 1.25rem;font:500 1.5rem/1.3 var(--head);letter-spacing:.12em}
.pin-form{display:grid;gap:.8rem}
.pin-digits{display:flex;justify-content:center;gap:clamp(.5rem,3vw,.85rem)}
.pin-digit{width:clamp(48px,14vw,60px);height:clamp(54px,15vw,66px);padding:0;border:0;border-radius:8px;background:#512A75;color:#fff;font:600 1.7rem/1 var(--head);text-align:center;caret-color:#fff;transition:box-shadow .18s ease,transform .18s ease}
.pin-digit:focus{outline:none;box-shadow:0 0 0 3px rgba(81,42,117,.25);transform:translateY(-2px)}
.pin-button{justify-self:center;min-height:44px;padding:.45rem 1.2rem;border:0;border-radius:6px;background:#512A75;color:#fff;font:600 1rem var(--head);cursor:pointer}
.pin-error{min-height:1.4em;margin:0;color:#512A75;font-size:1rem}
@media(max-width:820px){.pg{grid-template-columns:1fr 1fr}.pc,.pc:nth-child(5),.pc:nth-child(6){grid-column:auto}.pc:nth-child(1){grid-column:1/-1}.pc:nth-child(6){grid-column:1/-1;max-width:50%;margin:0 auto}}
@media(max-width:560px){.pg{grid-template-columns:1fr}.pc:nth-child(6){max-width:none}.m,.m:nth-child(n){margin:0 auto -1.5rem}nav{right:.4rem}body{font-size:1.15rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}.rv,.nae h2 span,.sur h2 .ch{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="pin-gate" id="pinGate">
  <div class="pin-card">
    <h1>ENTER PIN</h1>
    <form class="pin-form" id="pinForm">
      <div class="pin-digits" role="group" aria-label="Four-digit PIN">
        <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="PIN digit 1">
        <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="PIN digit 2">
        <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="PIN digit 3">
        <input class="pin-digit" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="PIN digit 4">
      </div>
      <button class="pin-button" type="submit">Unlock</button>
      <p class="pin-error" id="pinError" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
<nav id="nav" aria-label="Sections"></nav>

<section class="full hero" id="s1"><div class="bg" id="heroBg"></div><div class="hero-copy"><h1>HAPPY ANNIVERSARY</h1><p class="hero-subtitle">NEA SESANG</p><span class="hero-heart" aria-hidden="true">🤍</span></div></section>
<section class="proposal" id="s2"><div class="proposal-hearts" id="proposalHearts" aria-hidden="true"></div><div class="wrap">
  <p class="date rv">January 26, 2026</p>
  <div class="scene rv" id="scene"></div>
  <div class="letter" id="letter"></div>
</div></section>
<section class="full nae" id="s3"><div class="bg" id="naeBg"></div><h2 id="naeT"></h2></section>
<section class="poems" id="s4"><div class="poems-hearts" id="poemHearts" aria-hidden="true"></div><h2 class="title rv">KAVITHAIGAL</h2><div class="pg" id="pg"></div></section>

rope.addEventListener("pointerup",end);rope.addEventListener("pointercancel",end);
rope.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pull()}});
$("mas").innerHTML=CFG.mascotImg?`<img src="${CFG.mascotImg}" alt="Cute character" style="width:100%">`:`<svg viewBox="0 0 200 190" role="img" aria-label="DUDU_CHARACTER_PLACEHOLDER: cute lavender bear"><circle cx="48" cy="40" r="26" fill="#4d2d66"/><circle cx="152" cy="40" r="26" fill="#4d2d66"/><circle cx="48" cy="40" r="13" fill="#3a294d"/><circle cx="152" cy="40" r="13" fill="#3a294d"/><ellipse cx="100" cy="100" rx="78" ry="70" fill="#4d2d66"/><ellipse cx="100" cy="122" rx="30" ry="22" fill="#4a355d"/><ellipse cx="100" cy="112" rx="10" ry="7" fill="#40364A"/><circle cx="70" cy="90" r="9" fill="#40364A"/><circle cx="130" cy="90" r="9" fill="#40364A"/><circle cx="73" cy="87" r="3" fill="#fff"/><circle cx="133" cy="87" r="3" fill="#fff"/><circle cx="52" cy="110" r="10" fill="#f6b9c9" opacity=".8"/><circle cx="148" cy="110" r="10" fill="#f6b9c9" opacity=".8"/><path d="M90 128q10 9 20 0" stroke="#40364A" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="185" rx="42" ry="8" fill="#3a294d"/></svg>`;
$("bub").textContent=CFG.say;
$("qb").innerHTML=ph("QR_CODE_PLACEHOLDER",CFG.qrImg,"QR code for our surprise");
$("qa").href=CFG.qrUrl;$("qa").textContent=CFG.qrLabel;

let count=0,stopped=false,restarts=0,rec=null;
const msg=t=>$("msg").textContent=t;
function pull(){if(pulled)return;pulled=true;rope.classList.add("gone");setTimeout(()=>{$("stage").classList.add("show");speak()},500)}
function speak(){let started=false,queued=false;const go=()=>{if(started)return;started=true;listen()};
  if(CFG.voiceAudio){const a=new Audio(CFG.voiceAudio);a.onended=go;a.onerror=go;a.play().catch(go);return}
  if(!("speechSynthesis"in window)){go();return}
  const synth=speechSynthesis,youthful=/\b(child|young|kid|boy|junior)\b/i,bright=/google us english|samantha|jenny|aria|zira|ava|salli|kendra|kimberly|joelle/i,natural=/natural|neural|premium|enhanced/i;
  const rank=v=>(youthful.test(v.name)?100:0)+(bright.test(v.name)?50:0)+(/^en-US\b/i.test(v.lang)?20:0)+(natural.test(v.name)?10:0);
  const queue=voices=>{if(queued)return;queued=true;const vs=voices.filter(v=>/^en(?:-|$)/i.test(v.lang)),pick=vs.sort((a,b)=>rank(b)-rank(a))[0],u=new SpeechSynthesisUtterance(CFG.say);
    if(pick)u.voice=pick;u.lang=pick&&/^en/i.test(pick.lang)?pick.lang:"en-US";u.rate=.88;u.pitch=1.6;u.volume=1;u.onend=go;u.onerror=go;synth.cancel();synth.speak(u);setTimeout(go,12000)};
  const voices=synth.getVoices();if(voices.length){queue(voices);return}
  const onVoicesChanged=()=>{const loaded=synth.getVoices();if(loaded.length){clearTimeout(timer);synth.removeEventListener("voiceschanged",onVoicesChanged);queue(loaded)}};
  synth.addEventListener("voiceschanged",onVoicesChanged);
  const timer=setTimeout(()=>{synth.removeEventListener("voiceschanged",onVoicesChanged);queue(synth.getVoices())},1000)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){msg("Voice recognition isn’t supported in this browser. Use the button to count instead.");$("tap").hidden=false;return}
  rec=new SR();rec.lang="en-IN";rec.continuous=false;rec.interimResults=false;
  rec.onstart=()=>msg("Listening… say “I love you”");
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;
    const t=e.results[i][0].transcript.toLowerCase().replace(/[^a-z\s]/g," ");const n=(t.match(/\b(i|ai|eye)\s+(love|luv)\s+(you|u|yu)\b/g)||[]).length;if(n)add(n)}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){stopped=true;msg("Microphone access was blocked, so I can’t hear you. Allow it in your browser settings, or use the button.");$("tap").hidden=false}
    else if(e.error==="no-speech")msg("I didn’t hear anything. Try again.");else if(e.error==="audio-capture"){stopped=true;msg("No microphone found. Use the button instead.");$("tap").hidden=false}else if(e.error==="network")msg("Voice service unreachable. Retrying…")};
  rec.onend=()=>{if(!stopped&&count<5&&restarts++<60)setTimeout(()=>{try{rec.start()}catch(_){}},350);else if(restarts>=60&&count<5){msg("Voice listening stopped. Use the button to continue.");$("tap").hidden=false}};
  try{rec.start()}catch(_){}}
function add(n){const was=count;count=Math.min(5,count+n);for(let i=was;i<count;i++)setTimeout(burst,(i-was)*250);$("cnt").textContent=count+"/5";if(count>=5)done()}
$("tap").onclick=()=>add(1);
function burst(){if(RM)return;for(let i=0;i<5;i++){const h=document.createElement("span"),r=$("cnt").getBoundingClientRect();h.className="hp";h.innerHTML=heart(14+Math.random()*16);h.style.left=r.left+r.width/2+(Math.random()-.5)*120+"px";h.style.top=r.top+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1700)}}
function done(){stopped=true;try{rec&&rec.abort()}catch(_){}
  setTimeout(()=>{msg("");$("mas").style.display=$("bub").style.display=$("tap").style.display="none";$("qr").classList.add("show");
    if(!RM)for(let i=0;i<24;i++)setTimeout(()=>{const h=document.createElement("span");h.className="hp";h.innerHTML=heart(12+Math.random()*18);h.style.left=Math.random()*100+"vw";h.style.top=60+Math.random()*35+"vh";h.style.color=Math.random()>.5?"#4d2d66":"#33204a";document.body.appendChild(h);setTimeout(()=>h.remove(),1700)},i*110)},900)}
speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices();
</script>
</body>
</html>
